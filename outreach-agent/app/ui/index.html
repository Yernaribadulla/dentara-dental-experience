const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='overview',selected=null,cache={};const L={DRAFTED:'Черновик',APPROVED:'Одобрено',SENT:'Отправлено',FAILED:'Ошибка',DO_NOT_CONTACT:'Не связываться',WEBSITE_FOUND:'Сайт найден',WEBSITE_UNCERTAIN:'Статус не подтверждён',NO_WEBSITE_FOUND:'Сайт не найден'},T={overview:['Обзор','Контроль поиска, анализа и предложений'],discovery:['Поиск','Публичные источники и первичная проверка кандидатов'],clinics:['Клиники','Поиск и анализ потенциальных B2B клиентов'],drafts:['Черновики','Персонализированные предложения локального AI'],approved:['Одобрено','Только явно одобренные письма'],sent:['Отправлено','История отправок из журналов'],suppression:['Исключения','Адреса, которым нельзя писать'],settings:['Настройки','Локальная конфигурация интеграций']};async function api(p,o){let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}const post=(p,d)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2800)}function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('dentara-theme',t);$('#theme').textContent=t==='dark'?'Светлая тема':'Тёмная тема'}function init(){theme(localStorage.getItem('dentara-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}function status(x){return L[x]||x||'Не указан'}
function drawStats(s){let a=[['clinics','Клиники','найдено'],['contacts','Контакты','business-контакты'],['analyzed','Анализы','локально'],['drafted','Черновики','на проверке'],['approved','Одобрено','готово к симуляции'],['sent','Отправлено','в журнале'],['failed','Ошибки','требуют внимания'],['suppressed','Исключения','не связываться']];$('#stats').innerHTML=a.map(x=>`<div class="stat"><div class="stat-label">${x[1]}</div><div class="stat-value">${s[x[0]]||0}</div><div class="stat-note">${x[2]}</div></div>`).join('')}function head(t,d='',a=''){return`<div class="head"><div><h2>${t}</h2><p>${d}</p></div><div class="toolbar">${a}</div></div>`}async function load(){let s=await api('/api/dashboard');drawStats(s);render()}async function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#title').textContent=T[view][0];$('#subtitle').textContent=T[view][1];return({overview,discovery,clinics,drafts,approved:()=>drafts('APPROVED'),sent,suppression,settings}[view])()}function card(x){let a=x.status==='DRAFTED'?`<button class="btn secondary" data-edit="${x.id}">Редактировать</button><button class="btn" data-approve="${x.id}">Одобрить</button>`:x.status==='APPROVED'?`<button class="btn" data-send="${x.id}">Симулировать отправку</button>`:`<span class="meta">${x.status==='SENT'?'Отправлено':'Исключено'}</span>`;if(!['SENT','DO_NOT_CONTACT'].includes(x.status))a+=`<button class="btn danger" data-suppress="${esc(x.email)}">Исключить</button>`;return`<article class="card"><div><span class="badge ${x.status}">${status(x.status)}</span><h3>${esc(x.clinic_name)}</h3><div class="email">${esc(x.email)}</div><p class="meta">${esc(x.website||'Сайт не указан')}<br>Источник: ${esc(x.email_source||'не указан')}</p></div><div class="analysis"><b>Персонализация</b><p>${esc(x.rationale||'Не указана')}</p><b>Наблюдения из источников</b><ul>${(x.source_observations||[]).map(o=>`<li>${esc(o)}</li>`).join('')||'<li>Evidence не указ async function overview(){let q=await api('/api/queue'),a=await api('/api/activity');cache.q=q.items;$('#content').innerHTML=head('Последние черновики','Персонализированные предложения локального AI',`<button class="btn secondary" id="real">Тестирование · 10</button>`)+(q.items.length?`<div class="cards">${q.items.slice(0,4).map(card).join('')}</div>`:'<div class="empty">Черновиков пока нет.</div>')+`<section class="activity"><h2>Последние действия</h2><div class="activity-list">${a.items.map(x=>`<div><time>${esc(x.timestamp)}</time><b>${esc(x.type)}</b> · ${esc(x.clinic_name||x.recipient||'')}</div>`).join('')||'<div>Действий пока нет.</div>'}</div></section>`;bind();$('#real').onclick=async()=>{if(confirm('Запустить тест на 10 клиник?')){let r=await post('/api/run-real',{target_count:10});toast('Создано черновиков: '+r.drafts);load()}}}async function discovery(){let r=cache.dis||{candidates:[]};$('#content').innerHTML=head('Поиск','Официальные сайты и публичные business-источники',`<button class="btn" id="run">Запустить поиск</button>`)+`<div class="notice">Источники сохраняются как evidence. CAPTCHA, закрытые данные и anti-bot ограничения не обходятся.</div>`+(r.candidates.length?`<div class="table-wrap"><table class="table"><tr><th>Клиника</th><th>Сайт</th><th>Город</th><th>Состояние</th><th></th></tr>${r.candidates.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.website||'—')}</td><td>${esc(c.city||'—')}</td><td><span class="badge WEBSITE_FOUND">Сайт найден</span></td><td><button class="btn secondary" data-p='${JSON.stringify(c).replace(/'/g,'&#39;')}'>Анализировать</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Результатов пока нет.</div>');$('#run').onclick=async()=>{cache.dis=await post('/api/discover',{real:true,city:'Астана',category:'стоматология',target_count:10});toast('Кандидатов найдено: '+cache.dis.count);discovery()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{let r=await post('/api/pipeline',{mock:f ML=head('История отправок','Только записи из send logs')+(r.items.length?`<div class="table-wrap"><table class="table"><tr><th>Время</th><th>Клиника</th><th>Получатель</th><th>Провайдер</th><th>Статус</th></tr>${r.items.map(x=>`<tr><td class="meta">${esc(x.created_at)}</td><td>${esc(x.clinic_name||'—')}</td><td>${esc(x.recipient)}</td><td>${esc(x.provider==='simulated'?'Симуляция':x.provider)}</td><td><span class="badge SENT">${x.provider==='simulated'?'Симуляция':'Отправлено'}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Отправок пока нет.</div>')}async function suppression(){let r=await api('/api/suppression');$('#content').innerHTML=head('Список исключений','Адреса, которым запрещена отправка',`<button class="btn" id="add">Добавить адрес</button>`)+(r.items.length?`<div class="table-wrap"><table class="table"><tr><th>Email</th><th>Причина</th><th>Дата</th><th></th></tr>${r.items.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.reason)}</td><td>${esc(x.created_at)}</td><td><button class="btn danger" data-r="${esc(x.email)}">Удалить</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Список исключений пуст.</div>');$('#add').onclick=async()=>{let e=prompt('Email для списка исключений');if(e){await post('/api/suppress',{email:e,reason:'manual dashboard'});toast('Адрес исключён');suppression();load()}};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить адрес из списка?')){await post('/api/suppression/remove',{email:b.dataset.r});suppression();load()}})}async function settings(){let r=await api('/api/settings');$('#content').innerHTML=head('Настройки','Текущая локальная конфигурация')+`<div class="settings"><div class="settings-card"><h3>LM Studio</h3><p>URL<br><b>${esc(r.lm_studio_url)}</b></p><p>Модель<br><b>${esc(r.lm_studio_model)}</b></p><span class="badge WEBSITE_FOUND">Онлайн</span></div><div class="settings-card"><h3>Отправка</h3><p>Провайдер<br><b>${esc(r.provider==='simulated'?'Симуляция':
